<!DOCTYPE html>
<html lang="en">
    <head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Registration</title>
        <link rel="stylesheet" href="registration.css">
        <script src="registration.js"></script>
    </head>

    <body>
        <main>
        <div class="container">
            <h1 class="header">Registration Form</h1>
            <form class="form">
                <div class="text">
                <label for="username">Username:</label>
                <input class="rr" type="text" id="username" name="username" required>
        
                <label for="email">Email:</label>
                <input class="rr" type="email" id="email" name="email" required>
                
                <label for="password">Password:</label>
                <input class="rr" type="password" id="password" name="password" required>
                </div>
                <div class="lk">
                <button class="kl"type="submit" onclick="buttonSub()">Register</button>
            </div>
            </form>
        </div>
            <span id="success"></span>
        </main>

</body>
</html>
